<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Extasis 2">
  <meta name="theme-color" content="#1565C0">
  <title>ÉXTASIS — Terminal 2</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root {
  --ac:#1565C0; --ac2:#0D47A1;
  --ok:#2e7d32; --ok-bg:rgba(46,125,50,.12); --ok-bd:rgba(46,125,50,.3);
  --err:#c62828; --err-bg:rgba(198,40,40,.1);
  --warn:#e65100; --warn-bg:rgba(230,81,0,.1);
  --purple:#6a1b9a; --pur-bg:rgba(106,27,154,.1); --pur-bd:rgba(106,27,154,.25);
  --bg:#f0f2f5; --bg2:#fff; --bg3:#e8eaf0;
  --txt:#1a1a2e; --txt2:#444; --txt3:#888;
  --bd:#dde1ea; --bd2:#c8cdd8;
  --rs:14px; --shadow:0 2px 12px rgba(0,0,0,.08);
}
[data-theme="dark"] {
  --bg:#0f1117; --bg2:#1a1d27; --bg3:#252836;
  --txt:#f0f0ff; --txt2:#c0c4d8; --txt3:#7a7f9a;
  --bd:#2e3347; --bd2:#3d4260;
}
* { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
body { font-family:'Outfit',system-ui,sans-serif; background:var(--bg); color:var(--txt);
        min-height:100dvh; display:flex; flex-direction:column; overflow:hidden; }
@import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;800;900&display=swap');

/* ── HEADER ── */
.hdr {
  background: linear-gradient(135deg,#1565C0 0%,#0D47A1 100%);
  color:#fff; padding:0 14px; height:56px;
  display:flex; align-items:center; gap:10px; flex-shrink:0;
  box-shadow:0 2px 8px rgba(0,0,0,.2);
}
.hdr-logo { width:36px;height:36px;border-radius:50%;background:#fff;
             display:flex;align-items:center;justify-content:center;
             font-weight:900;font-size:12px;color:#1565C0;flex-shrink:0; }
.hdr-title { flex:1; font-weight:800; font-size:15px; letter-spacing:.05em; }
.hdr-badge { background:rgba(255,255,255,.2); border-radius:20px;
              padding:3px 10px; font-size:10px; font-weight:700;
              letter-spacing:.08em; }
.hdr-btn { width:36px;height:36px;border-radius:10px;border:none;
            background:rgba(255,255,255,.15);color:#fff;cursor:pointer;
            font-size:16px;display:flex;align-items:center;justify-content:center; }

/* ── STATS BAR ── */
.stats-bar {
  display:flex; gap:8px; padding:10px 14px 6px; overflow-x:auto;
  background:var(--bg); flex-shrink:0;
}
.stats-bar::-webkit-scrollbar { display:none; }
.stat-pill {
  flex-shrink:0; background:var(--bg2); border:1.5px solid var(--bd);
  border-radius:12px; padding:7px 14px; min-width:90px;
}
.stat-pill .lbl { font-size:9px;font-weight:800;letter-spacing:.07em;
                   text-transform:uppercase;color:var(--txt3); }
.stat-pill .val { font-size:16px;font-weight:800;color:var(--txt); }
.stat-pill.primary { background:var(--ac);border-color:var(--ac); }
.stat-pill.primary .lbl, .stat-pill.primary .val { color:#fff; }

/* ── MAIN ── */
.main { flex:1; overflow-y:auto; padding-bottom:80px; }
.page { display:none; }
.page.active { display:block; }

/* ── CART ── */
.cart-area { padding:12px 14px 0; }
.cart-header { display:flex;justify-content:space-between;align-items:center;
                margin-bottom:10px; }
.cart-title { font-size:13px;font-weight:800;letter-spacing:.06em;
               text-transform:uppercase;color:var(--txt3);
               display:flex;align-items:center;gap:6px; }
.cart-dot { width:8px;height:8px;border-radius:50%;background:var(--ac); }
.btn-vaciar { background:none;border:none;color:var(--txt3);font-size:12px;
               cursor:pointer;padding:4px 8px;border-radius:8px; }
.btn-vaciar:hover { background:var(--bg3); }
.cart-empty { text-align:center;padding:40px 20px;color:var(--txt3); }
.cart-empty .ico { font-size:36px;margin-bottom:8px; }
.cart-empty .msg { font-size:13px; }
.cart-item {
  background:var(--bg2); border:1.5px solid var(--bd); border-radius:14px;
  padding:12px 14px; margin-bottom:8px;
  display:flex; align-items:center; gap:10px;
}
.ci-name { flex:1; font-weight:700; font-size:13px; }
.ci-sub { font-size:11px;color:var(--txt3);margin-top:2px; }
.ci-qty { display:flex;align-items:center;gap:8px; }
.ci-qty button { width:28px;height:28px;border-radius:8px;border:1.5px solid var(--bd2);
                  background:var(--bg3);cursor:pointer;font-size:14px;font-weight:700;
                  color:var(--txt);display:flex;align-items:center;justify-content:center; }
.ci-qty span { font-weight:800;min-width:20px;text-align:center; }
.ci-price { font-weight:800;font-size:14px;white-space:nowrap; }
.ci-del { background:none;border:none;color:var(--txt3);cursor:pointer;font-size:16px;
           padding:4px; }

/* ── TOTALS ── */
.totals-wrap {
  position:sticky; bottom:72px; background:var(--bg2);
  border-top:2px solid var(--bd); padding:12px 14px;
  flex-shrink:0;
}
.tot-big { text-align:center;margin-bottom:10px; }
.tot-big .lbl { font-size:10px;font-weight:800;letter-spacing:.1em;
                 text-transform:uppercase;color:var(--txt3); }
.tot-big .val { font-size:32px;font-weight:900;color:var(--txt); }
.tot-rows { font-size:12px;color:var(--txt3);margin-bottom:10px; }
.tot-row { display:flex;justify-content:space-between;padding:2px 0; }
.tot-row.total { font-weight:800;font-size:14px;color:var(--txt);border-top:1px solid var(--bd);padding-top:6px;margin-top:4px; }
.tot-row.disc { color:var(--ok); }
.tot-row.cuotas { color:var(--warn); }

/* ── MÉTODOS DE PAGO ── */
.metodos-lbl { font-size:10px;font-weight:800;letter-spacing:.08em;
                text-transform:uppercase;color:var(--txt3);margin-bottom:6px; }
.metodos-grid { display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px; }
.metodo-btn {
  padding:8px 12px; border-radius:12px;
  border:2px solid var(--bd); background:var(--bg2);
  font-size:12px;font-weight:700;color:var(--txt);cursor:pointer;
  transition:all .15s;
}
.metodo-btn.active {
  border-color:var(--ac); background:rgba(21,101,192,.1); color:var(--ac);
}
.credito-panel { margin-bottom:10px; }
.credito-title { font-size:11px;font-weight:800;color:var(--warn);margin-bottom:6px; }
.cuotas-grid { display:flex;gap:6px;flex-wrap:wrap; }
.cuota-btn {
  padding:7px 14px;border-radius:10px;border:2px solid var(--bd2);
  background:var(--bg2);font-weight:700;font-size:13px;cursor:pointer;color:var(--txt);
}
.cuota-btn.active { border-color:var(--warn);background:rgba(230,81,0,.1);color:var(--warn); }

/* ── CONFIRM BUTTONS ── */
.action-bar {
  position:fixed; bottom:0; left:0; right:0; z-index:100;
  display:grid; grid-template-columns:1fr 1fr; gap:8px;
  padding:8px 14px 12px; background:var(--bg);
  border-top:1px solid var(--bd);
}
.btn-confirm {
  padding:14px; border-radius:14px; border:none; cursor:pointer;
  font-size:15px;font-weight:800;
  background:var(--ok);color:#fff;
}
.btn-cancel {
  padding:14px; border-radius:14px; border:none; cursor:pointer;
  font-size:15px;font-weight:800;
  background:var(--err);color:#fff;
}

/* ── NAV ── */
.nav {
  position:fixed; bottom:0; left:0; right:0; z-index:200;
  height:64px; background:var(--bg2); border-top:1.5px solid var(--bd);
  display:grid; grid-template-columns:repeat(3,1fr);
}
.nav-btn {
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:3px; border:none; background:none; cursor:pointer;
  color:var(--txt3); font-size:9px;font-weight:700;letter-spacing:.05em;
  text-transform:uppercase; padding:8px 0;
}
.nav-btn .ico { font-size:22px; }
.nav-btn.active { color:var(--ac); }
.nav-badge {
  position:absolute; top:6px; right:calc(50% - 18px);
  background:var(--err);color:#fff;border-radius:10px;
  font-size:9px;font-weight:800;padding:1px 5px;min-width:16px;text-align:center;
}

/* ── CATÁLOGO ── */
.cat-search {
  padding:10px 14px; position:sticky;top:0;background:var(--bg);z-index:10;
}
.cat-search input {
  width:100%;padding:10px 14px;border-radius:12px;
  border:1.5px solid var(--bd2);background:var(--bg2);
  font-size:14px;color:var(--txt);outline:none;
}
.cat-filters {
  display:flex;gap:6px;padding:0 14px 8px;overflow-x:auto;
}
.cat-filters::-webkit-scrollbar { display:none; }
.filter-chip {
  flex-shrink:0;padding:6px 12px;border-radius:20px;
  border:1.5px solid var(--bd2);background:var(--bg2);
  font-size:11px;font-weight:700;color:var(--txt3);cursor:pointer;
}
.filter-chip.active { border-color:var(--ac);background:rgba(21,101,192,.1);color:var(--ac); }
.prod-list { padding:0 14px 8px; }
.prod-card {
  background:var(--bg2);border:1.5px solid var(--bd);border-radius:14px;
  padding:12px 14px;margin-bottom:8px;
  display:flex;align-items:center;gap:10px;
}
.pc-badge {
  width:36px;height:36px;border-radius:10px;
  display:flex;align-items:center;justify-content:center;
  font-size:10px;font-weight:800;flex-shrink:0;
}
.pc-badge.H { background:#e3f2fd;color:#1565C0; }
.pc-badge.M { background:#fce4ec;color:#c2185b; }
.pc-badge.A { background:#f3e5f5;color:#7b1fa2; }
.pc-info { flex:1;min-width:0; }
.pc-name { font-weight:700;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis; }
.pc-cat { font-size:11px;color:var(--txt3);margin-top:2px; }
.pc-prices { text-align:right;flex-shrink:0; }
.pc-lista { font-size:11px;color:var(--txt3);text-decoration:line-through; }
.pc-efect { font-size:14px;font-weight:800;color:var(--ac); }
.btn-add {
  width:36px;height:36px;border-radius:10px;border:none;
  background:var(--ac);color:#fff;font-size:20px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;flex-shrink:0;
}

/* ── CAJA ── */
.caja-wrap { padding:14px; }
.caja-header { display:flex;justify-content:space-between;align-items:center;margin-bottom:14px; }
.caja-title { font-size:18px;font-weight:800; }
.kpi-grid { display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px; }
.kpi-card {
  background:var(--bg2);border:1.5px solid var(--bd);border-radius:14px;
  padding:14px;
}
.kpi-card.primary { background:var(--ac);border-color:var(--ac); }
.kpi-card .kpi-lbl { font-size:9px;font-weight:800;letter-spacing:.08em;
                       text-transform:uppercase;color:var(--txt3);margin-bottom:4px; }
.kpi-card.primary .kpi-lbl { color:rgba(255,255,255,.7); }
.kpi-card .kpi-val { font-size:20px;font-weight:800;color:var(--txt); }
.kpi-card.primary .kpi-val { color:#fff; }
.ventas-list { background:var(--bg2);border:1.5px solid var(--bd);border-radius:14px;padding:14px; }
.venta-item {
  display:flex;align-items:center;gap:10px;padding:8px 0;
  border-bottom:1px solid var(--bd);
}
.venta-item:last-child { border-bottom:none; }
.v-time { font-size:11px;color:var(--txt3);width:40px;flex-shrink:0; }
.v-info { flex:1; }
.v-method { font-size:11px;font-weight:700; }
.v-items { font-size:10px;color:var(--txt3); }
.v-total { font-weight:800;font-size:14px; }

/* ── BADGE de método ── */
.mbadge {
  display:inline-block;padding:3px 8px;border-radius:8px;
  font-size:10px;font-weight:700;
}

/* ── TOAST ── */
#toast {
  position:fixed;bottom:80px;left:50%;transform:translateX(-50%) translateY(20px);
  background:#222;color:#fff;padding:10px 20px;border-radius:12px;
  font-size:13px;font-weight:600;opacity:0;transition:all .3s;
  z-index:9999;pointer-events:none;white-space:nowrap;max-width:90vw;
}
#toast.show { opacity:1;transform:translateX(-50%) translateY(0); }
#toast.ok { background:#2e7d32; }
#toast.warn { background:#e65100; }
#toast.err { background:#c62828; }

/* ── LOADING OVERLAY ── */
#loading {
  position:fixed;inset:0;background:var(--bg);z-index:9000;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;
}
.spin {
  width:40px;height:40px;border:4px solid var(--bd);
  border-top-color:var(--ac);border-radius:50%;
  animation:spin .8s linear infinite;
}
@keyframes spin { to { transform:rotate(360deg); } }
.load-txt { font-size:14px;color:var(--txt3);font-weight:600; }
</style>
</head>
<body>

<!-- Loading -->
<div id="loading">
  <div class="spin"></div>
  <div class="load-txt">Conectando con Éxtasis...</div>
</div>

<!-- HEADER -->
<header class="hdr">
  <div class="hdr-logo">É2</div>
  <div class="hdr-title">ÉXTASIS</div>
  <div class="hdr-badge">TERMINAL 2</div>
  <button class="hdr-btn" onclick="toggleDark()" title="Modo oscuro">🌙</button>
</header>

<!-- STATS BAR -->
<div class="stats-bar" id="stats-bar">
  <div class="stat-pill primary"><div class="lbl">Efectivo</div><div class="val" id="st-efect">$0</div></div>
  <div class="stat-pill"><div class="lbl">Ventas día</div><div class="val" id="st-ventas">$0</div></div>
  <div class="stat-pill"><div class="lbl">Transf.</div><div class="val" id="st-transf">$0</div></div>
  <div class="stat-pill"><div class="lbl">Débito</div><div class="val" id="st-debito">$0</div></div>
  <div class="stat-pill"><div class="lbl" style="color:var(--warn)">Crédito</div><div class="val" style="color:var(--warn)" id="st-credito">$0</div></div>
</div>

<!-- PAGES -->
<main class="main">

  <!-- VENTAS -->
  <div id="page-ventas" class="page active">
    <div class="cart-area">
      <div class="cart-header">
        <div class="cart-title"><span class="cart-dot"></span>TICKET ACTUAL</div>
        <button class="btn-vaciar" onclick="vaciarCarrito()">Vaciar</button>
      </div>
      <div id="cart-list"></div>
    </div>

    <div class="totals-wrap" id="totals-wrap" style="display:none">
      <div class="tot-big">
        <div class="lbl">TOTAL A COBRAR</div>
        <div class="val" id="tot-big-val">$0</div>
      </div>
      <div class="tot-rows" id="tot-rows"></div>
      <div class="metodos-lbl">MÉTODO DE PAGO</div>
      <div class="metodos-grid" id="metodos-grid"></div>
      <div id="credito-panel" class="credito-panel" style="display:none">
        <div class="credito-title">🏦 CUOTAS CON TARJETA</div>
        <div class="cuotas-grid" id="cuotas-grid"></div>
        <div id="cuotas-info" style="font-size:11px;color:var(--txt3);margin-top:6px;">Precio lista · sin descuento</div>
      </div>
    </div>
  </div>

  <!-- CATÁLOGO -->
  <div id="page-catalogo" class="page">
    <div class="cat-search">
      <input type="search" id="cat-search" placeholder="🔍  Buscar producto..." oninput="renderCatalogo()">
    </div>
    <div class="cat-filters" id="cat-filters"></div>
    <div class="prod-list" id="prod-list"></div>
  </div>

  <!-- CAJA -->
  <div id="page-caja" class="page">
    <div class="caja-wrap">
      <div class="caja-header">
        <div class="caja-title">Caja del día</div>
      </div>
      <div class="kpi-grid" id="kpi-grid"></div>
      <div class="ventas-list">
        <div style="font-weight:700;margin-bottom:10px;">Ventas registradas</div>
        <div id="ventas-list-inner"></div>
      </div>
    </div>
  </div>

</main>

<!-- ACTION BAR (ventas) -->
<div id="action-bar" style="display:none;position:fixed;bottom:64px;left:0;right:0;z-index:100;
     display:none;grid-template-columns:1fr 1fr;gap:8px;padding:8px 14px 10px;
     background:var(--bg);border-top:1px solid var(--bd);">
  <button class="btn-confirm" onclick="confirmarVenta()">🛒 Confirmar</button>
  <button class="btn-cancel" onclick="cancelarVenta()">✕ Cancelar</button>
</div>

<!-- NAV -->
<nav class="nav">
  <button class="nav-btn active" id="nav-ventas" onclick="goPage('ventas')">
    <span class="ico">🛒</span>
    <span>VENTAS</span>
    <span class="nav-badge" id="cart-badge" style="display:none">0</span>
  </button>
  <button class="nav-btn" id="nav-catalogo" onclick="goPage('catalogo')">
    <span class="ico">👗</span>
    <span>CATÁLOGO</span>
  </button>
  <button class="nav-btn" id="nav-caja" onclick="goPage('caja')">
    <span class="ico">💰</span>
    <span>CAJA</span>
  </button>
</nav>

<div id="toast"></div>

<script>
/* ══════════════════════════════════════
   SUPABASE CONFIG
══════════════════════════════════════ */
const SUPA_URL = "https://tuehpjpygkuytbdjkeoh.supabase.co";
const SUPA_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InR1ZWhwanB5Z2t1eXRiZGprZW9oIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzczMzQ1NDgsImV4cCI6MjA5MjkxMDU0OH0.DxmIxvxT5Q5TjRgXm3MDWv9B0KHFfwzcXTBxo34BkVU";
const TERMINAL = "secundaria";
const DISCOUNT = 0.20;

var supa = null;
var S = {
  products: [], sales: [], cart: [],
  method: "Efectivo", creditoCuotas: 1,
  dark: localStorage.getItem("ex2_dark2") === "true",
  filter: "Todos",
};

/* ── Utils ── */
function fmt(n) {
  return "$" + Math.round(n||0).toLocaleString("es-AR");
}
function mkToday() { return new Date().toLocaleDateString("es-AR"); }
function mkTime()  { return new Date().toLocaleTimeString("es-AR",{hour:"2-digit",minute:"2-digit"}); }

function toast(msg, type) {
  var t = document.getElementById("toast");
  t.textContent = msg;
  t.className = "show " + (type||"");
  clearTimeout(t._timer);
  t._timer = setTimeout(function(){ t.className = ""; }, 2800);
}

function toggleDark() {
  S.dark = !S.dark;
  localStorage.setItem("ex2_dark2", S.dark);
  applyDark();
}
function applyDark() {
  document.documentElement.setAttribute("data-theme", S.dark ? "dark" : "light");
}

/* ── SUPABASE ── */
async function supaGET(table, params) {
  var url = SUPA_URL + "/rest/v1/" + table + "?" + (params||"select=*&order=id.asc");
  var r = await fetch(url, { headers: { "apikey": SUPA_KEY, "Authorization": "Bearer " + SUPA_KEY } });
  return r.ok ? r.json() : [];
}
async function supaINSERT(table, row) {
  var r = await fetch(SUPA_URL + "/rest/v1/" + table, {
    method: "POST",
    headers: { "apikey": SUPA_KEY, "Authorization": "Bearer " + SUPA_KEY,
                "Content-Type": "application/json", "Prefer": "resolution=merge-duplicates" },
    body: JSON.stringify(row)
  });
  return r.ok;
}

function rowToProd(r) {
  return { id:r.id, producto:r.producto, nombre:r.nombre,
            categoria:r.categoria, subcategoria:r.subcategoria, precio:r.precio };
}
function rowToSale(r) {
  return { id:r.id, terminal:r.terminal, date:r.date, time:r.time,
            method:r.method, baseTotal:r.base_total, discount:r.discount,
            total:r.total, items:r.items||[], creditoCuotas:r.credito_cuotas||1 };
}

/* ── INIT ── */
async function init() {
  applyDark();
  supa = window.supabase.createClient(SUPA_URL, SUPA_KEY);

  var today = mkToday();
  var [prods, sales] = await Promise.all([
    supaGET("ex_products"),
    supaGET("ex_sales", "select=*&terminal=eq." + TERMINAL + "&date=eq." + encodeURIComponent(today) + "&order=id.desc")
  ]);

  S.products = (prods||[]).map(rowToProd);
  S.sales = (sales||[]).map(rowToSale);

  document.getElementById("loading").style.display = "none";
  renderAll();
  subscribeRealtime();
}

function subscribeRealtime() {
  supa.channel("ext2_sales")
    .on("postgres_changes", {
      event: "INSERT", schema: "public", table: "ex_sales",
      filter: "terminal=eq." + TERMINAL
    }, function(payload) {
      var sale = rowToSale(payload.new);
      if (!S.sales.find(function(s){ return s.id === sale.id; })) {
        S.sales.unshift(sale);
        renderStats();
        renderCaja();
      }
    })
    .subscribe();
}

/* ── NAVEGACIÓN ── */
function goPage(name) {
  ["ventas","catalogo","caja"].forEach(function(p) {
    document.getElementById("page-" + p).classList.toggle("active", p === name);
    document.getElementById("nav-" + p).classList.toggle("active", p === name);
  });
  if (name === "ventas") renderVentas();
  if (name === "catalogo") renderCatalogo();
  if (name === "caja") renderCaja();
}

/* ── CARRITO ── */
function addToCart(prod) {
  var item = S.cart.find(function(i){ return i.id === prod.id; });
  if (item) { item.qty++; }
  else { S.cart.push({id:prod.id, name:prod.producto, price:prod.precio, qty:1}); }
  renderVentas();
  toast("✓ " + prod.producto + " agregado", "ok");
  updateBadge();
}
function updQty(id, delta) {
  var item = S.cart.find(function(i){ return i.id===id; });
  if (!item) return;
  item.qty += delta;
  if (item.qty <= 0) S.cart = S.cart.filter(function(i){ return i.id!==id; });
  renderVentas();
  updateBadge();
}
function vaciarCarrito() {
  if (!S.cart.length) return;
  if (!confirm("¿Vaciar el carrito?")) return;
  S.cart = [];
  S.method = "Efectivo";
  S.creditoCuotas = 1;
  renderVentas();
  updateBadge();
}
function cancelarVenta() { vaciarCarrito(); }
function updateBadge() {
  var cnt = S.cart.reduce(function(a,i){ return a+i.qty; },0);
  var b = document.getElementById("cart-badge");
  b.textContent = cnt;
  b.style.display = cnt > 0 ? "block" : "none";
}

function setMethod(m) {
  S.method = m;
  if (m !== "Crédito") S.creditoCuotas = 1;
  renderVentas();
}
function setCuotas(n) {
  S.creditoCuotas = n;
  renderVentas();
}

function cartCalc() {
  var base = S.cart.reduce(function(a,i){ return a+i.price*i.qty; },0);
  var isDisc = (S.method==="Efectivo" || S.method==="Transferencia");
  var disc = isDisc ? Math.round(base * DISCOUNT) : 0;
  return { base, disc, total: base - disc };
}

/* ── RENDER VENTAS ── */
function renderVentas() {
  var list = document.getElementById("cart-list");
  var totWrap = document.getElementById("totals-wrap");
  var actionBar = document.getElementById("action-bar");

  if (!S.cart.length) {
    list.innerHTML = '<div class="cart-empty"><div class="ico">🛒</div><div class="msg">Carrito vacío<br>Agregá productos desde Catálogo</div></div>';
    totWrap.style.display = "none";
    actionBar.style.display = "none";
    return;
  }

  var cc = cartCalc();
  var isDisc = (S.method==="Efectivo"||S.method==="Transferencia");
  var unitMult = isDisc ? (1 - DISCOUNT) : 1;

  list.innerHTML = S.cart.map(function(item) {
    var unit = Math.round(item.price * unitMult);
    return '<div class="cart-item">' +
      '<div style="flex:1">' +
        '<div class="ci-name">' + item.name + '</div>' +
        '<div class="ci-sub">' + fmt(unit) + ' c/u</div>' +
      '</div>' +
      '<div class="ci-qty">' +
        '<button onclick="updQty(' + item.id + ',-1)">−</button>' +
        '<span>' + item.qty + '</span>' +
        '<button onclick="updQty(' + item.id + ',1)">+</button>' +
      '</div>' +
      '<div class="ci-price">' + fmt(unit * item.qty) + '</div>' +
      '<button class="ci-del" onclick="updQty(' + item.id + ',-999)">✕</button>' +
    '</div>';
  }).join('');

  totWrap.style.display = "block";
  actionBar.style.display = "grid";

  document.getElementById("tot-big-val").textContent = fmt(cc.total);

  var rows = '';
  rows += '<div class="tot-row"><span>' + S.cart.reduce(function(a,i){return a+i.qty;},0) + ' producto(s)</span><span>' + fmt(cc.base) + ' lista</span></div>';
  if (cc.disc) rows += '<div class="tot-row disc"><span>Descuento 20%</span><span>−' + fmt(cc.disc) + '</span></div>';
  if (S.method==="Crédito" && S.creditoCuotas > 1) {
    rows += '<div class="tot-row cuotas"><span>🏦 ' + S.creditoCuotas + 'x de</span><span>' + fmt(Math.ceil(cc.total/S.creditoCuotas)) + '</span></div>';
  }
  rows += '<div class="tot-row total"><span>TOTAL FINAL</span><span>' + fmt(cc.total) + '</span></div>';
  document.getElementById("tot-rows").innerHTML = rows;

  var METHODS = [
    {key:"Efectivo",icon:"💵",lbl:"Efectivo"},
    {key:"Transferencia",icon:"📲",lbl:"Transf."},
    {key:"Débito",icon:"💳",lbl:"Débito"},
    {key:"Crédito",icon:"🏦",lbl:"Crédito"},
    {key:"Mixto",icon:"⚡",lbl:"Mixto"},
  ];
  document.getElementById("metodos-grid").innerHTML = METHODS.map(function(m) {
    return '<button class="metodo-btn ' + (S.method===m.key?"active":"") + '" onclick="setMethod(\'' + m.key + '\')">' +
      m.icon + ' ' + m.lbl + '</button>';
  }).join('');

  var cp = document.getElementById("credito-panel");
  if (S.method === "Crédito") {
    cp.style.display = "block";
    document.getElementById("cuotas-grid").innerHTML = [1,3,6,12].map(function(n) {
      return '<button class="cuota-btn ' + (S.creditoCuotas===n?"active":"") + '" onclick="setCuotas(' + n + ')">' + n + 'x</button>';
    }).join('');
    if (S.creditoCuotas > 1) {
      document.getElementById("cuotas-info").textContent = S.creditoCuotas + ' cuotas de ' + fmt(Math.ceil(cc.total/S.creditoCuotas)) + ' · Total: ' + fmt(cc.total);
    } else {
      document.getElementById("cuotas-info").textContent = "Precio lista · sin descuento";
    }
  } else {
    cp.style.display = "none";
  }
}

/* ── CONFIRMAR VENTA ── */
async function confirmarVenta() {
  if (!S.cart.length) { toast("El carrito está vacío","warn"); return; }
  var cc = cartCalc();
  var sale = {
    id: Date.now(), terminal: TERMINAL,
    date: mkToday(), time: mkTime(), method: S.method,
    base_total: cc.base, discount: cc.disc, total: cc.total,
    items: S.cart.map(function(i){ return {id:i.id,name:i.name,price:i.price,qty:i.qty}; }),
    credito_cuotas: S.creditoCuotas
  };

  var ok = await supaINSERT("ex_sales", sale);
  if (ok) {
    S.sales.unshift(rowToSale({
      id:sale.id, terminal:sale.terminal, date:sale.date, time:sale.time,
      method:sale.method, base_total:sale.base_total, discount:sale.discount,
      total:sale.total, items:sale.items, credito_cuotas:sale.credito_cuotas
    }));
    S.cart = []; S.method = "Efectivo"; S.creditoCuotas = 1;
    renderAll();
    updateBadge();
    toast("Venta de " + fmt(cc.total) + " registrada 🛒", "ok");
  } else {
    toast("Error al guardar la venta","err");
  }
}

/* ── CATÁLOGO ── */
function renderCatalogo() {
  var q = (document.getElementById("cat-search").value||"").toLowerCase();
  var generos = ["Todos","Hombre","Mujer","Accesorios"];
  document.getElementById("cat-filters").innerHTML = generos.map(function(g) {
    return '<button class="filter-chip ' + (S.filter===g?"active":"") + '" onclick="setFilter(\'' + g + '\')">' + g + '</button>';
  }).join('');

  var prods = S.products.filter(function(p) {
    if (S.filter !== "Todos" && p.nombre !== S.filter) return false;
    if (q && !(p.producto||"").toLowerCase().includes(q)) return false;
    return true;
  });

  var BADGE = { Hombre:"H", Mujer:"M", Accesorios:"A" };
  document.getElementById("prod-list").innerHTML = prods.length ?
    prods.map(function(p) {
      var b = BADGE[p.nombre]||"A";
      var pe = Math.round((p.precio||0)*0.8);
      return '<div class="prod-card">' +
        '<div class="pc-badge ' + b + '">' + b + '</div>' +
        '<div class="pc-info">' +
          '<div class="pc-name">' + (p.producto||"") + '</div>' +
          '<div class="pc-cat">' + [p.categoria,p.subcategoria].filter(Boolean).join(" · ") + '</div>' +
        '</div>' +
        '<div class="pc-prices">' +
          '<div class="pc-lista">' + fmt(p.precio) + '</div>' +
          '<div class="pc-efect">' + fmt(pe) + '</div>' +
        '</div>' +
        '<button class="btn-add" onclick="addToCart(S.products.find(function(x){return x.id===' + p.id + ';}))" title="Agregar">+</button>' +
      '</div>';
    }).join('') :
    '<div style="text-align:center;padding:40px;color:var(--txt3);">Sin productos</div>';
}

function setFilter(f) {
  S.filter = f;
  renderCatalogo();
}

/* ── CAJA ── */
function renderCaja() {
  var today = mkToday();
  var ts = S.sales.filter(function(s){ return s.date===today; });
  var totalVentas = ts.reduce(function(a,s){return a+s.total;},0);
  var totalTransf = ts.filter(function(s){return s.method==="Transferencia";}).reduce(function(a,s){return a+s.total;},0);
  var totalDeb = ts.filter(function(s){return s.method==="Débito";}).reduce(function(a,s){return a+s.total;},0);
  var totalCred = ts.filter(function(s){return s.method==="Crédito";}).reduce(function(a,s){return a+s.total;},0);
  var noEfect = totalTransf + totalDeb + totalCred;
  var efectivo = totalVentas - noEfect;

  document.getElementById("kpi-grid").innerHTML =
    '<div class="kpi-card primary"><div class="kpi-lbl">Efectivo en caja</div><div class="kpi-val">' + fmt(efectivo) + '</div></div>' +
    '<div class="kpi-card"><div class="kpi-lbl">Total ventas</div><div class="kpi-val">' + fmt(totalVentas) + '</div></div>' +
    '<div class="kpi-card"><div class="kpi-lbl">Transferencia</div><div class="kpi-val">' + fmt(totalTransf) + '</div></div>' +
    '<div class="kpi-card"><div class="kpi-lbl">Débito</div><div class="kpi-val">' + fmt(totalDeb) + '</div></div>' +
    '<div class="kpi-card" style="border-color:rgba(230,81,0,.3)"><div class="kpi-lbl" style="color:var(--warn)">Crédito</div><div class="kpi-val" style="color:var(--warn)">' + fmt(totalCred) + '</div></div>' +
    '<div class="kpi-card"><div class="kpi-lbl">Transacciones</div><div class="kpi-val">' + ts.length + '</div></div>';

  var MSTYLE = {
    "Efectivo":"background:#e8f5e9;color:#2e7d32",
    "Transferencia":"background:#e3f2fd;color:#1565C0",
    "Débito":"background:#f3e5f5;color:#7b1fa2",
    "Crédito":"background:rgba(230,81,0,.1);color:#e65100",
    "Mixto":"background:#f5f5f5;color:#555",
  };
  document.getElementById("ventas-list-inner").innerHTML = ts.length ?
    ts.map(function(s) {
      var st = MSTYLE[s.method]||MSTYLE.Mixto;
      var cuotas = s.creditoCuotas > 1 ? " " + s.creditoCuotas + "x" : "";
      return '<div class="venta-item">' +
        '<div class="v-time">' + s.time + '</div>' +
        '<div class="v-info">' +
          '<span class="mbadge" style="' + st + '">' + s.method + cuotas + '</span>' +
          '<div class="v-items" style="margin-top:3px;">' + (s.items||[]).map(function(i){return i.name;}).join(", ") + '</div>' +
        '</div>' +
        '<div class="v-total">' + fmt(s.total) + '</div>' +
      '</div>';
    }).join('') :
    '<div style="text-align:center;padding:24px;color:var(--txt3);">Sin ventas registradas hoy</div>';
}

/* ── STATS BAR ── */
function renderStats() {
  var today = mkToday();
  var ts = S.sales.filter(function(s){return s.date===today;});
  var totalVentas = ts.reduce(function(a,s){return a+s.total;},0);
  var totalTransf = ts.filter(function(s){return s.method==="Transferencia";}).reduce(function(a,s){return a+s.total;},0);
  var totalDeb = ts.filter(function(s){return s.method==="Débito";}).reduce(function(a,s){return a+s.total;},0);
  var totalCred = ts.filter(function(s){return s.method==="Crédito";}).reduce(function(a,s){return a+s.total;},0);
  var efectivo = totalVentas - totalTransf - totalDeb - totalCred;

  document.getElementById("st-efect").textContent = fmt(efectivo);
  document.getElementById("st-ventas").textContent = fmt(totalVentas);
  document.getElementById("st-transf").textContent = fmt(totalTransf);
  document.getElementById("st-debito").textContent = fmt(totalDeb);
  document.getElementById("st-credito").textContent = fmt(totalCred);
}

function renderAll() {
  renderStats();
  renderVentas();
  var active = document.querySelector(".page.active");
  if (active && active.id === "page-catalogo") renderCatalogo();
  if (active && active.id === "page-caja") renderCaja();
}

/* ── START ── */
applyDark();
window.addEventListener("load", init);
</script>
</body>
